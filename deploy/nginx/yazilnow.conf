# nginx for a VPS: the website, the app in a browser and the API on one server.
# Copy to /etc/nginx/sites-available/yazilnow.conf, link it into sites-enabled, then:
#   sudo certbot --nginx -d yazilnow.az -d www.yazilnow.az -d app.yazilnow.az -d api.yazilnow.az
# Paths: /var/www/yazilnow/site (deploy/out/site), /var/www/yazilnow/app (deploy/out/app),
#        /var/www/yazilnow/backend (the Laravel app; its public/ is the API's root).
# Replace yazilnow.az everywhere if the domain differs.
# Note: an add_header inside a location drops the server's add_header lines, so locations only use `expires`.


server {
    listen 80;
    listen [::]:80;
    server_name yazilnow.az www.yazilnow.az app.yazilnow.az api.yazilnow.az;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ─── Website ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yazilnow.az;
    ssl_certificate     /etc/letsencrypt/live/yazilnow.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yazilnow.az/privkey.pem;
    return 301 https://yazilnow.az$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yazilnow.az;
    ssl_certificate     /etc/letsencrypt/live/yazilnow.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yazilnow.az/privkey.pem;

    root /var/www/yazilnow/site;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.yazilnow.az; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # QR codes, the wall QR, shared salon links and the salon panel open the app in a browser.
    location ~ ^/(r|s|salon)/([A-Za-z0-9_-]+)/?$ { return 302 https://app.yazilnow.az/$1/$2$is_args$args; }
    location ~ ^/panel/?$ { return 302 https://app.yazilnow.az/panel$is_args$args; }

    # iPhone / Android check these to open QR links in the installed app.
    location = /.well-known/apple-app-site-association { default_type application/json; try_files $uri =404; }
    location = /.well-known/assetlinks.json { default_type application/json; try_files $uri =404; }

    location = /config.js { expires -1; try_files $uri =404; }
    location ~* \.(js|css|webp|png|jpg|svg|mp4|webm|woff2|json)$ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known) { deny all; }
}

# ─── The app in a browser (salon panel, QR reviews, salon pages) ────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yazilnow.az;
    ssl_certificate     /etc/letsencrypt/live/yazilnow.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yazilnow.az/privkey.pem;

    root /var/www/yazilnow/app;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.yazilnow.az; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Hashed bundles never change.
    location ^~ /_expo/ { expires max; try_files $uri =404; }
    location ^~ /assets/ { expires max; try_files $uri =404; }
    # One page app: every other path is index.html, which always revalidates.
    location / { expires -1; try_files $uri /index.html; }
    location ~ /\. { deny all; }
}

# ─── API and admin panel (Laravel) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yazilnow.az;
    ssl_certificate     /etc/letsencrypt/live/yazilnow.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yazilnow.az/privkey.pem;

    root /var/www/yazilnow/backend/public;
    index index.php;
    server_tokens off;
    charset utf-8;
    # Salon photos are up to 8 MB.
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    # Uploaded photos: served as images only, never run.
    location ^~ /storage/ { expires 30d; try_files $uri =404; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    # Nothing else PHP, no dotfiles (.env), ever.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
