; Supervisor: the queue worker that sends sign-up codes, booking emails, pushes and WhatsApp messages.
; sudo cp deploy/yazilnow-queue.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
[program:yazilnow-queue]
command=php /var/www/yazilnow/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/yazilnow/backend/storage/logs/queue.log
