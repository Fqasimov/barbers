      name="description"
      content="Bakının bərbərxana, gözəllik salonu və kosmetologiya mərkəzlərinin boş vaxtlarını canlı görün və zəngsiz yazılın. Salonlar üçün: usta sayına görə ödəniş yoxdur, 30 gün pulsuz."

    <script src="/config.js"></script>
    <script>
      // The opening plays once per visit and never with reduced motion; decided before first paint so nothing flashes.
      try {
        if (sessionStorage.getItem('usta-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.add('no-intro');
        else document.documentElement.classList.add('intro-on');
      } catch (e) {
        document.documentElement.classList.add('no-intro');
      }
    </script>
    <script type="application/ld+json">

    </script>
