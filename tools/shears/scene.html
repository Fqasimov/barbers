<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const params = new URLSearchParams(location.search);
const SIZE = +(params.get('size') || 900);
const BG = params.get('bg'); // hex without # for opaque background, else transparent
const SHADOW = params.get('shadow') !== '0';
const VIEW = params.get('view') || 'splash';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: !BG, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
if (BG) renderer.setClearColor(new THREE.Color('#' + BG), 1);
else renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// ---- Studio environment: dark room, two softboxes, a warm linen bounce ----
function studio() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40), new THREE.MeshBasicMaterial({ color: 0x55504a, side: THREE.BackSide }));
  env.add(room);
  const panel = (w, h, color, intensity, pos, look) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(...pos);
    m.lookAt(...look);
    env.add(m);
  };
  panel(26, 14, 0xffffff, 2.6, [-3, -6, 19], [0, 0, 0]);   // big overhead softbox (what flat steel mirrors)
  panel(5, 26, 0xffffff, 6.0, [6, 0, 19.5], [6, 0, 0]);   // bright strip overhead — the long highlight on the blades
  panel(16, 9, 0xffffff, 4.0, [-12, 12, 12], [0, 0, 0]);  // key softbox, upper left
  panel(3, 22, 0xfff6ea, 3.2, [16, -2, 8], [0, 0, 0]);    // strip, right
  panel(30, 30, 0xeee6da, 0.9, [0, 0, -18], [0, 0, 0]);   // linen bounce from the table
  panel(4, 14, 0xdfe8ff, 1.6, [-14, -10, 6], [0, 0, 0]);  // cool kicker, lower left
  return env;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(studio(), 0.035).texture;
scene.environmentIntensity = 1.0;

// Shadow-casting light (the key), straight-ish from above so the shadow sits under the shears.
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(-40, 70, 220);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -140; sun.shadow.camera.right = 140; sun.shadow.camera.top = 140; sun.shadow.camera.bottom = -140;
sun.shadow.camera.near = 50; sun.shadow.camera.far = 500;
sun.shadow.radius = 14; sun.shadow.blurSamples = 25; sun.shadow.bias = -0.0005;
scene.add(sun);

if (SHADOW) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.ShadowMaterial({ opacity: 0.22, color: 0x2a2015 }));
  floor.position.z = -7;
  floor.receiveShadow = true;
  scene.add(floor);
}

// ---- Materials ----
const polished = new THREE.MeshPhysicalMaterial({ color: 0xdfe1e4, metalness: 1, roughness: 0.12, clearcoat: 0.4, clearcoatRoughness: 0.08 });
const satin = new THREE.MeshPhysicalMaterial({ color: 0xcfd2d6, metalness: 1, roughness: 0.3, anisotropy: 0.6 });
const screwMat = new THREE.MeshPhysicalMaterial({ color: 0xe4e6e9, metalness: 1, roughness: 0.18 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x16130f, metalness: 0.2, roughness: 0.6 });

const T = 2.0; // blade thickness, mm

function extrude(shape, depth, bevel = 0.7, mat = polished) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 6, curveSegments: 64 });
  g.translate(0, 0, -depth / 2);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  return m;
}

/**
 * One half of a pair of barber shears, pivot at the origin, tip along +x.
 * The upper blade and the lower handle are one forged piece; the other half is its mirror.
 */
function half({ tang }) {
  const g = new THREE.Group();

  // Blade + hub. Cutting edge runs flat along y≈0, the spine arcs over it to a fine point.
  const s = new THREE.Shape();
  s.moveTo(0, -5.2);
  s.lineTo(30, -5.0);
  s.bezierCurveTo(60, -4.4, 90, -2.2, 106, -0.5);
  s.quadraticCurveTo(108, 0, 106.4, 0.5);
  s.bezierCurveTo(88, 2.8, 52, 6.6, 16, 7.4);
  s.lineTo(0, 7.4);
  s.lineTo(0, -5.2);
  const blade = extrude(s, T, 0.55, polished);
  g.add(blade);

  // Hub disc so the pivot reads as one solid boss.
  const hub = new THREE.Shape();
  hub.absarc(0, 0, 9.4, 0, Math.PI * 2, false);
  g.add(extrude(hub, T, 0.55, polished));

  // Shank: from the hub, sweeping down-left to the ring. Slightly flattened round bar.
  const shankPath = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-2, -2, 0),
    new THREE.Vector3(-14, -7.5, 0),
    new THREE.Vector3(-28, -13, 0),
    new THREE.Vector3(-38, -16.5, 0),
  ]);
  const shank = new THREE.Mesh(new THREE.TubeGeometry(shankPath, 64, 3.9, 24, false), satin);
  shank.scale.z = 0.55;
  shank.castShadow = true;
  g.add(shank);

  // Finger ring: an offset oval, like real shears.
  const ring = new THREE.Mesh(new THREE.TorusGeometry(12.5, 4.1, 32, 96), satin);
  ring.position.set(-51, -21, 0);
  ring.scale.set(1.18, 0.92, 0.48);
  ring.rotation.z = -0.32;
  ring.castShadow = true;
  g.add(ring);

  // Soft insert inside the ring (rubber silencer) — a hint of black, very barber.
  const insert = new THREE.Mesh(new THREE.TorusGeometry(10.2, 0.9, 16, 96), darkMat);
  insert.position.copy(ring.position);
  insert.scale.copy(ring.scale);
  insert.rotation.copy(ring.rotation);
  g.add(insert);

  if (tang) {
    // Finger rest hooking off the ring.
    const tangPath = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-58, -33, 0),
      new THREE.Vector3(-66, -41, 0),
      new THREE.Vector3(-76, -44, 0),
      new THREE.Vector3(-84, -41.5, 0),
    ]);
    const t = new THREE.Mesh(new THREE.TubeGeometry(tangPath, 48, 2.6, 20, false), satin);
    t.scale.z = 0.55;
    t.castShadow = true;
    g.add(t);
    const end = new THREE.Mesh(new THREE.SphereGeometry(2.6, 24, 16), satin);
    end.position.set(-84, -41.5, 0);
    end.scale.z = 0.55;
    g.add(end);
  }
  return g;
}

const shears = new THREE.Group();
const A = half({ tang: false });
A.position.z = T / 2 + 0.75;
const B = half({ tang: true });
B.scale.y = -1;
B.position.z = -(T / 2 + 0.75);
const pivotA = new THREE.Group(); pivotA.add(A);
const pivotB = new THREE.Group(); pivotB.add(B);
shears.add(pivotA, pivotB);

// Pivot screw with a slot.
const screwTop = T + 2.2;
const screw = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.9, 1.8, 48), screwMat);
screw.rotation.x = Math.PI / 2;
screw.position.z = screwTop;
screw.castShadow = true;
shears.add(screw);
const dome = new THREE.Mesh(new THREE.SphereGeometry(4.6, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), screwMat);
dome.rotation.x = Math.PI / 2;
dome.scale.y = 0.35;
dome.position.z = screwTop + 0.9;
shears.add(dome);
const slot = new THREE.Mesh(new RoundedBoxGeometry(7.4, 0.9, 1.4, 2, 0.3), darkMat);
slot.position.z = screwTop + 1.9;
slot.rotation.z = 0.6;
shears.add(slot);

scene.add(shears);

// ---- Camera ----
const camera = new THREE.PerspectiveCamera(22, 1, 10, 2000);
function frameFor(view) {
  if (view === 'icon') {
    shears.rotation.set(0, 0, THREE.MathUtils.degToRad(40));
    shears.position.set(14, -6, 0);
    camera.position.set(0, -70, 420);
  } else {
    shears.rotation.set(0, 0, THREE.MathUtils.degToRad(32));
    shears.position.set(2, -2, 0);
    camera.position.set(0, -230, 520);
  }
  camera.lookAt(0, 0, 0);
}
frameFor(VIEW);

window.renderAngle = (deg) => {
  const r = THREE.MathUtils.degToRad(deg / 2);
  pivotA.rotation.z = r;
  pivotB.rotation.z = -r;
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
