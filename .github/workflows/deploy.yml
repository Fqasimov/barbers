# Deploys yazilnow.az on every push to main (or by hand: Actions → Deploy → Run workflow).
# Builds the website, the app and the server like deploy/package-cpanel.sh, uploads the result as
# one zip over FTPS (thousands of single files made the host drop the connection), then calls
# public_html/yazilnow-deploy.php, which unpacks it and runs the database migrations.
#
# Repository secrets: FTP_HOST, FTP_USER, FTP_PASSWORD and DEPLOY_KEY (the same value as
# DEPLOY_KEY in ~/yazilnow-api/.env). The FTP account's folder must be the home folder
# (/home/yazilmaf), so public_html/ and yazilnow-api/ sit at its top.
# The zip never holds the server's .env, uploaded photos or logs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: FTP secrets present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Add FTP_HOST, FTP_USER, FTP_PASSWORD and DEPLOY_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, fileinfo, exif, curl, zip, bcmath, pdo_mysql
          tools: composer:v2

      - name: Server dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build website, app and server
        run: |
          UPDATE=1 DOMAIN=yazilnow.az deploy/package-cpanel.sh

      - name: Upload
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          up() {
            curl --fail --silent --show-error --ssl-reqd --retry 5 --retry-delay 10 --retry-all-errors \
              --user "$FTP_USER:$FTP_PASSWORD" -T "$1" "ftp://$FTP_HOST/$2"
          }
          up deploy/cpanel/yazilnow-deploy.php public_html/yazilnow-deploy.php
          up deploy/out/yazilnow-cpanel.zip yazilnow-deploy.zip

      - name: Unpack and migrate on the server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 900 -X POST \
            -H "X-Deploy-Key: $DEPLOY_KEY" https://yazilnow.az/yazilnow-deploy.php
