# Deploys yazilnow.az on every push to main (or by hand: Actions → Deploy → Run workflow).
# Builds the website, the app and the server like deploy/package-cpanel.sh, uploads them over FTP
# (only changed files), then asks the server to run its database migrations.
#
# Repository secrets: FTP_HOST, FTP_USER, FTP_PASSWORD, and optionally DEPLOY_KEY (the same value
# as DEPLOY_KEY in ~/yazilnow-api/.env). The FTP account's folder must be the home folder
# (/home/yazilmaf), so public_html/ and yazilnow-api/ sit at its top.
# The server's .env, uploaded photos and logs are never touched.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: FTP secrets present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Add FTP_HOST, FTP_USER and FTP_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, fileinfo, exif, curl, zip, bcmath, pdo_mysql
          tools: composer:v2

      - name: Server dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build website, app and server
        run: |
          UPDATE=1 DOMAIN=yazilnow.az deploy/package-cpanel.sh

      - name: Upload website and app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: deploy/out/cpanel/public_html/
          server-dir: public_html/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            server
            server/**
            .well-known/**
            cgi-bin/**

      - name: Upload server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: deploy/out/cpanel/yazilnow-api/
          server-dir: yazilnow-api/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            .env
            storage/**
            bootstrap/cache/**
            public/storage
            public/storage/**

      - name: Database migrations
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::No DEPLOY_KEY secret: files are up, but run 'php artisan migrate --force' on the server yourself."
            exit 0
          fi
          curl -fsS -X POST -H "X-Deploy-Key: $DEPLOY_KEY" -H "Accept: application/json" https://yazilnow.az/api/deploy/migrate
